# FONTS
font_family      monospace
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

tab_bar_edge top
tab_bar_style powerline
tab_bar_align left

# CURSOR
# cursor #cccccc #cursor color
cursor_shape block
cursor_shape_unfocused hollow
shell_integration no-cursor

window_margin_width 5 10

background_opacity .8

# Tema Centralizado (Siempre al final para que pise configuraciones anteriores)
include ~/.config/theme/kitty/current.conf
